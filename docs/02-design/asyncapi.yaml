asyncapi: '2.6.0'
info:
  title: Respuesta — Eventos
  version: 0.1.0
  description: >-
    Eventos asíncronos (patrón cola + worker sobre AWS SQS/SNS — ADR-0012) del flujo central. La cola absorbe picos sin
    perder mensajes (offline-first, ADR-0001). El motor de matching consume `report.ingested` y
    publica `candidate.generated`. Las transiciones de estado se auditan (RS-06).
    Los canales `inbound.*`/`media.stored`/`outbound.reply` modelan la ingestión de Meta del Gestor
    de Webhooks y el Worker de Bóveda (ADR-0005): texto al LLM on-prem, adjuntos a la bóveda cifrada.
    Los cuerpos con PII viajan cifrados en JWE.
    Sobre común de eventos (ADR-0011): todo evento adopta `event_id`, `event_type` (`domain.event`),
    `producer`, `timestamp`, `version` (semver) y `payload`. Catálogo canónico del flujo central:
    catálogo canónico en **inglés** (`report.received`, `report.ingested`, `candidate.generated`,
    `match.confirmed`, `match.resolved`, `state.changed`, `notification.sent`) — ver ADR-0011.

servers:
  broker:
    url: https://sqs.sa-east-1.amazonaws.com
    protocol: sqs
    description: Broker gestionado AWS SQS/SNS (fan-out SNS, DLQ por redrive) — ADR-0012 (sa-east-1)

defaultContentType: application/json

channels:
  meta.received:
    description: Payload crudo de Meta publicado por el Webhook Gateway; lo procesa el Meta Handler.
    publish:
      operationId: onMetaReceived
      message: { $ref: '#/components/messages/MetaReceived' }
  inbound.text:
    description: Mensaje de texto de Meta, saneado y enrutado al LLM on-prem (cuerpo JWE).
    publish:
      operationId: onInboundText
      message: { $ref: '#/components/messages/InboundText' }
  inbound.media:
    description: Referencia de adjunto (media_id) de Meta para que la bóveda lo descargue y cifre.
    publish:
      operationId: onInboundMedia
      message: { $ref: '#/components/messages/InboundMedia' }
  media.stored:
    description: Adjunto descargado, escaneado (AV/CSAM) y cifrado en la bóveda; listo para matching.
    subscribe:
      operationId: consumeMediaStored
      message: { $ref: '#/components/messages/MediaStored' }
  outbound.reply:
    description: Respuesta a entregar al usuario por la Graph API (servicio de salida).
    publish:
      operationId: onOutboundReply
      message: { $ref: '#/components/messages/OutboundReply' }
  meta.received.dlq:
    description: DLQ de meta.received; el Gestor de DLQ marca el evento como fallido.
    subscribe:
      operationId: consumeMetaReceivedDlq
      message: { $ref: '#/components/messages/DeadLetter' }
  inbound.text.dlq:
    description: DLQ de inbound.text; el Gestor de DLQ marca el evento como fallido.
    subscribe:
      operationId: consumeInboundTextDlq
      message: { $ref: '#/components/messages/DeadLetter' }
  inbound.media.dlq:
    description: DLQ de inbound.media; el Gestor de DLQ marca el evento como fallido.
    subscribe:
      operationId: consumeInboundMediaDlq
      message: { $ref: '#/components/messages/DeadLetter' }
  media.stored.dlq:
    description: DLQ de media.stored; el Gestor de DLQ marca el evento como fallido.
    subscribe:
      operationId: consumeMediaStoredDlq
      message: { $ref: '#/components/messages/DeadLetter' }
  outbound.reply.dlq:
    description: DLQ de outbound.reply; el Gestor de DLQ marca el evento como fallido.
    subscribe:
      operationId: consumeOutboundReplyDlq
      message: { $ref: '#/components/messages/DeadLetter' }
  report.received:
    description: Reporte capturado y encolado (offline-first).
    publish:
      operationId: onReportReceived
      message: { $ref: '#/components/messages/ReportReceived' }
  report.ingested:
    description: Adjuntos en el almacén protegido; listo para resolver.
    subscribe:
      operationId: consumeReportIngested
      message: { $ref: '#/components/messages/ReportIngested' }
  candidate.generated:
    description: Candidato con confianza; el back office lo enruta por umbral.
    publish:
      operationId: onCandidateGenerated
      message: { $ref: '#/components/messages/CandidateGenerated' }
  match.confirmed:
    description: Match confirmado (coordinador ≥65 % o autoreporte 100 %).
    publish:
      operationId: onMatchConfirmed
      message: { $ref: '#/components/messages/MatchConfirmed' }
  match.resolved:
    description: >-
      Resolución manual de un candidato por el coordinador desde el back office (ADR-0010): MATCHED o
      DISCARDED, con justificación y firma. Cierra el ciclo del match manual y alimenta la auditoría
      SHA-256 (ADR-0007/ADR-0011).
    publish:
      operationId: onMatchResolved
      message: { $ref: '#/components/messages/MatchResolved' }
  state.changed:
    description: Transición de estado (auditada).
    publish:
      operationId: onStateChanged
      message: { $ref: '#/components/messages/StateChanged' }
  notification.sent:
    description: Notificación entregada al clúster opt-in.
    publish:
      operationId: onNotificationSent
      message: { $ref: '#/components/messages/NotificationSent' }
  entity.enrolled:
    description: >-
      El rostro del sujeto quedó enlazado a su entidad en el índice biométrico (ADR-0016). Puede
      disparar re-matching de reportes de "encontrado" previos al enrolamiento.
    publish:
      operationId: onEntityEnrolled
      message: { $ref: '#/components/messages/EntityEnrolled' }
  enrollment.failed:
    description: >-
      No se pudo enrolar (sin rostro, baja calidad, sujeto ausente, expirado o selección inválida).
      El chatbot guía al reportante a reenviar una foto (ADR-0016).
    publish:
      operationId: onEnrollmentFailed
      message: { $ref: '#/components/messages/EnrollmentFailed' }
  face.disambiguation.requested:
    description: >-
      La foto trae ≥2 rostros; el worker pide al reportante (vía chatbot) que elija cuál es el
      desaparecido, adjuntando recortes numerados (ADR-0016). No hay auto-resolución (ADR-0001/0004).
    publish:
      operationId: onFaceDisambiguationRequested
      message: { $ref: '#/components/messages/FaceDisambiguationRequested' }
  face.disambiguation.resolved:
    description: >-
      Respuesta del reportante: índice del rostro elegido o "ninguno". El worker enrola solo ese
      rostro y purga el resto (minimización GDPR, ADR-0016).
    subscribe:
      operationId: consumeFaceDisambiguationResolved
      message: { $ref: '#/components/messages/FaceDisambiguationResolved' }

components:
  messages:
    MetaReceived:
      name: MetaReceived
      payload: { $ref: '#/components/schemas/MetaRawEvent' }
    InboundText:
      name: InboundText
      payload: { $ref: '#/components/schemas/InboundText' }
    InboundMedia:
      name: InboundMedia
      payload: { $ref: '#/components/schemas/InboundMedia' }
    MediaStored:
      name: MediaStored
      payload: { $ref: '#/components/schemas/MediaStored' }
    OutboundReply:
      name: OutboundReply
      payload: { $ref: '#/components/schemas/OutboundReply' }
    DeadLetter:
      name: DeadLetter
      payload: { $ref: '#/components/schemas/DeadLetter' }
    ReportReceived:
      name: ReportReceived
      payload: { $ref: '#/components/schemas/ReportRef' }
    ReportIngested:
      name: ReportIngested
      payload: { $ref: '#/components/schemas/ReportIngested' }
    CandidateGenerated:
      name: CandidateGenerated
      payload: { $ref: '#/components/schemas/Candidate' }
    MatchConfirmed:
      name: MatchConfirmed
      payload: { $ref: '#/components/schemas/MatchConfirmed' }
    MatchResolved:
      name: MatchResolved
      payload: { $ref: '#/components/schemas/MatchResolved' }
    StateChanged:
      name: StateChanged
      payload: { $ref: '#/components/schemas/StateChanged' }
    NotificationSent:
      name: NotificationSent
      payload: { $ref: '#/components/schemas/NotificationSent' }
    EntityEnrolled:
      name: EntityEnrolled
      payload: { $ref: '#/components/schemas/EntityEnrolled' }
    EnrollmentFailed:
      name: EnrollmentFailed
      payload: { $ref: '#/components/schemas/EnrollmentFailed' }
    FaceDisambiguationRequested:
      name: FaceDisambiguationRequested
      payload: { $ref: '#/components/schemas/FaceDisambiguationRequested' }
    FaceDisambiguationResolved:
      name: FaceDisambiguationResolved
      payload: { $ref: '#/components/schemas/FaceDisambiguationResolved' }

  schemas:
    MetaChannel:
      type: string
      enum: [whatsapp, instagram, messenger]
    MediaType:
      type: string
      enum: [image, audio, video, document]
    DeadLetter:
      type: object
      description: 'Mensaje inprocesable enrutado por DLX; el Gestor de DLQ marca el evento como fallido (EventAction ERR).'
      required: [event_id, source_queue, reason, retries]
      properties:
        event_id: { type: string, format: uuid }
        source_queue:
          type: string
          description: 'Cola de origen del mensaje muerto.'
        reason:
          type: string
          enum: [validation_error, download_failed, scan_rejected, max_retries, ttl_expired, unknown]
          description: 'Causa de la caida a DLQ.'
        retries: { type: integer, minimum: 0 }
        original_payload:
          type: object
          description: 'Mensaje original tal cual, para reproceso.'
        failed_at: { type: string, format: date-time }
    MetaRawEvent:
      type: object
      description: 'Payload crudo del webhook de Meta tras verificacion de firma e idempotencia (ADR-0005).'
      required: [event_id, bot_id, object, raw]
      properties:
        event_id: { type: string, format: uuid }
        bot_id: { type: string, format: uuid }
        object: { type: string, enum: [page, whatsapp_business_account, instagram] }
        signature_verified: { type: boolean }
        raw:
          type: object
          description: 'Cuerpo tal cual lo envio Meta (entry[]), sin normalizar.'
        received_at: { type: string, format: date-time }
    InboundText:
      type: object
      description: 'Texto entrante de Meta tras verificacion de firma e idempotencia (ADR-0005).'
      required: [event_id, bot_id, channel, contact_ref]
      properties:
        event_id: { type: string, format: uuid }
        bot_id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/MetaChannel' }
        contact_ref:
          type: string
          description: 'waId/fbId resuelto, sin PII en claro.'
        jwe_body:
          type: string
          description: 'Cuerpo del mensaje cifrado en JWE, clave por evento.'
        received_at: { type: string, format: date-time }
    InboundMedia:
      type: object
      description: 'Referencia a un adjunto; el binario NO viaja por el webhook, solo media_id.'
      required: [event_id, bot_id, media_id, media_type]
      properties:
        event_id: { type: string, format: uuid }
        bot_id: { type: string, format: uuid }
        media_id:
          type: string
          description: 'Id de medio de la Graph API para descarga.'
        media_type: { $ref: '#/components/schemas/MediaType' }
        mime_type: { type: string }
        contact_ref: { type: string }
    MediaStored:
      type: object
      description: 'Adjunto descargado, escaneado AV/CSAM y cifrado en la boveda.'
      required: [event_id, media_ref, media_type, scan]
      properties:
        event_id: { type: string, format: uuid }
        media_ref:
          type: string
          description: 'Puntero al objeto cifrado en el almacen protegido.'
        media_type: { $ref: '#/components/schemas/MediaType' }
        scan:
          type: string
          enum: [clean, quarantined, rejected]
          description: 'Resultado del escaneo AV/CSAM.'
        contact_ref:
          type: string
          description: 'Contacto que envió el adjunto; correlaciona la foto con su reporte (ADR-0016).'
        bot_id: { type: string }
        stored_at: { type: string, format: date-time }
    OutboundReply:
      type: object
      description: 'Respuesta a enviar por la Graph API, desacoplada de la recepcion.'
      required: [bot_id, channel, contact_ref]
      properties:
        bot_id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/MetaChannel' }
        contact_ref: { type: string }
        jwe_body:
          type: string
          description: 'Contenido de la respuesta cifrado en JWE.'
    PersonState:
      type: string
      enum: [desaparecido, a_salvo, localizado_estable, localizado_critico, fallecido, no_identificado]
    Routing:
      type: string
      enum: [discard, coordinator, fuse]
    BBox:
      type: array
      description: 'Caja del rostro [x1, y1, x2, y2] en píxeles sobre la imagen original.'
      items: { type: integer }
      minItems: 4
      maxItems: 4
    FaceQuality:
      type: object
      properties:
        size_px: { type: integer, description: 'Lado mínimo del rostro en píxeles.' }
        blur_var: { type: number, description: 'Varianza del Laplaciano (más bajo = más borroso).' }
    EntityEnrolled:
      type: object
      description: 'Sujeto enlazado a su huella en el índice biométrico 512-d (ADR-0013/0016).'
      required: [entity_id]
      properties:
        entity_id: { type: string }
        report_id: { type: string }
        face_quality: { $ref: '#/components/schemas/FaceQuality' }
        det_score: { type: number, minimum: 0, maximum: 1 }
        source:
          type: string
          enum: [report.ingested, face.disambiguation.resolved]
          description: 'Evento que originó el enrolamiento.'
        contact_ref: { type: string, description: 'Reportante a quien avisar "reporte completo" (ADR-0016).' }
        bot_id: { type: string }
        channel: { type: string }
    EnrollmentFailed:
      type: object
      description: 'Enrolamiento no realizado; el chatbot solicita acción al reportante (ADR-0016).'
      required: [entity_id, reason]
      properties:
        entity_id: { type: string }
        report_id: { type: string }
        reason:
          type: string
          enum: [no_face, low_quality, no_subject_in_photo, expired, invalid_selection]
          description: 'Motivo del fallo de enrolamiento.'
        conversation_key:
          type: string
          description: 'Sesión del reportante para responderle (ADR-0015).'
        contact_ref: { type: string, description: 'Reportante para pedirle otra foto (ADR-0016).' }
        bot_id: { type: string }
        channel: { type: string }
    PendingFaceRef:
      type: object
      description: 'Rostro candidato presentado al reportante para que elija (sin embedding en el evento).'
      required: [index, bbox]
      properties:
        index: { type: integer, minimum: 0 }
        crop_ref:
          type: string
          description: 'Puntero al recorte cifrado y efímero en la bóveda (ADR-0008).'
        bbox: { $ref: '#/components/schemas/BBox' }
        det_score: { type: number, minimum: 0, maximum: 1 }
    FaceDisambiguationRequested:
      type: object
      description: 'Solicitud de desambiguación: ≥2 rostros, el reportante debe elegir (ADR-0016).'
      required: [disambiguation_id, entity_id, faces]
      properties:
        disambiguation_id: { type: string }
        entity_id: { type: string }
        report_id: { type: string }
        conversation_key: { type: string }
        contact_ref: { type: string, description: 'Reportante a quien preguntar (ADR-0016).' }
        bot_id: { type: string }
        channel: { type: string }
        expires_at: { type: string, format: date-time }
        faces:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/PendingFaceRef' }
    FaceDisambiguationResolved:
      type: object
      description: 'Respuesta del reportante: índice elegido o "ninguno de estos" (ADR-0016).'
      required: [disambiguation_id]
      properties:
        disambiguation_id: { type: string }
        selected_index:
          type: integer
          minimum: 0
          description: 'Índice del rostro elegido. Ausente si action=none_of_these.'
        action:
          type: string
          enum: [none_of_these]
          description: 'El sujeto no está en la foto; pedir otra.'
    ReportRef:
      type: object
      required: [report_id, intention]
      properties:
        report_id: { type: string, format: uuid }
        intention: { type: string, enum: [desaparecido, encontrado, autoreporte] }
        received_at: { type: string, format: date-time }
    ReportIngested:
      type: object
      required: [report_id, entity_id]
      properties:
        report_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        media_ref: { type: string, description: Referencia en el almacén protegido. }
        contact_ref: { type: string, description: 'Reportante; permite avisarle al cerrar (ADR-0016).' }
        bot_id: { type: string }
        channel: { type: string }
    Candidate:
      type: object
      description: Salida del motor de matching (ADR-0004).
      required: [entity_id, face_distance, band, routing]
      properties:
        entity_id: { type: string, format: uuid }
        face_distance: { type: number, minimum: 0, maximum: 1 }
        band: { type: string, enum: [strong, drift_tolerated, discard] }
        routing: { $ref: '#/components/schemas/Routing' }
        fused_score: { type: number, minimum: 0, maximum: 1 }
    MatchConfirmed:
      type: object
      required: [entity_id, confirmed_by]
      properties:
        entity_id: { type: string, format: uuid }
        confirmed_by: { type: string, description: coordinador | autoreporte }
        confirmed_at: { type: string, format: date-time }
    MatchResolved:
      type: object
      description: 'Decisión manual del coordinador sobre un candidato (ADR-0010/ADR-0011).'
      required: [match_id, decision, coordinador_id]
      properties:
        match_id: { type: string, format: uuid }
        decision: { type: string, enum: [MATCHED, DISCARDED] }
        coordinador_id: { type: string, description: 'Usuario+ID del coordinador que firma.' }
        justificacion: { type: string }
        firma: { type: string, description: 'Firma de la decisión (no repudio).' }
        resolved_at: { type: string, format: date-time }
    StateChanged:
      type: object
      required: [entity_id, to_state, mechanism, actor, at]
      properties:
        entity_id: { type: string, format: uuid }
        to_state: { $ref: '#/components/schemas/PersonState' }
        mechanism: { type: string, enum: [autorreporte, rescatista, coordinador, autoridad] }
        actor: { type: string }
        at: { type: string, format: date-time }
    NotificationSent:
      type: object
      required: [entity_id, channel]
      properties:
        entity_id: { type: string, format: uuid }
        channel: { type: string, enum: [whatsapp, instagram, messenger, telegram, web] }
        opt_in: { type: boolean }
        sent_at: { type: string, format: date-time }
