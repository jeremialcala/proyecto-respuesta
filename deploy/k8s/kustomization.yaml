apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: respuesta
resources:
  - namespace.yaml
  - webhook-gateway
  - matching-worker
# Sustituir ACCOUNT_ID, región y tag al publicar en ECR (o vía CI):
images:
  - name: respuesta/webhook-gateway
    newName: ACCOUNT_ID.dkr.ecr.sa-east-1.amazonaws.com/respuesta/webhook-gateway
    newTag: "0.1.0"
  - name: respuesta/matching-worker
    newName: ACCOUNT_ID.dkr.ecr.sa-east-1.amazonaws.com/respuesta/matching-worker
    newTag: "0.1.0"
