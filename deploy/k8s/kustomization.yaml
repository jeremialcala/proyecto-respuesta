apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: respuesta
resources:
  - namespace.yaml
  - webhook-gateway
  - meta-handler
  - vault-worker
  - chatbot-gateway
  - output-service
  - core-backend
  - llm
  - matching-worker
  - inference-worker
# Sustituir ACCOUNT_ID, región y tag al publicar en ECR (o vía CI):
images:
  - name: respuesta/webhook-gateway
    newName: ACCOUNT_ID.dkr.ecr.sa-east-1.amazonaws.com/respuesta/webhook-gateway
    newTag: "0.1.0"
  - name: respuesta/meta-handler
    newName: ACCOUNT_ID.dkr.ecr.sa-east-1.amazonaws.com/respuesta/meta-handler
    newTag: "0.1.0"
  - name: respuesta/vault-worker
    newName: ACCOUNT_ID.dkr.ecr.sa-east-1.amazonaws.com/respuesta/vault-worker
    newTag: "0.1.0"
  - name: respuesta/chatbot-gateway
    newName: ACCOUNT_ID.dkr.ecr.sa-east-1.amazonaws.com/respuesta/chatbot-gateway
    newTag: "0.1.0"
  - name: respuesta/output-service
    newName: ACCOUNT_ID.dkr.ecr.sa-east-1.amazonaws.com/respuesta/output-service
    newTag: "0.1.0"
  - name: respuesta/core-backend
    newName: ACCOUNT_ID.dkr.ecr.sa-east-1.amazonaws.com/respuesta/core-backend
    newTag: "0.1.0"
  - name: respuesta/matching-worker
    newName: ACCOUNT_ID.dkr.ecr.sa-east-1.amazonaws.com/respuesta/matching-worker
    newTag: "0.1.0"
  - name: respuesta/matching-worker-inference
    newName: ACCOUNT_ID.dkr.ecr.sa-east-1.amazonaws.com/respuesta/matching-worker-inference
    newTag: "0.1.0"
