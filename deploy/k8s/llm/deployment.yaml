apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  labels: {app.kubernetes.io/name: llm, app.kubernetes.io/part-of: respuesta}
spec:
  replicas: 1   # LLM on-prem (Ollama) en GPU — ADR-0001/0006 (RTX 3090). No autoritativo.
  selector:
    matchLabels: {app.kubernetes.io/name: llm}
  template:
    metadata:
      labels: {app.kubernetes.io/name: llm}
    spec:
      # Plano GPU DEDICADO del LLM, separado del facematch (ADR-0018/0001): pool `llm`. El node group
      # GPU del LLM debe portar la etiqueta+taint `respuesta.io/gpu-pool=llm`.
      nodeSelector: {"respuesta.io/gpu-pool": "llm"}
      tolerations:
        - {key: "respuesta.io/gpu-pool", operator: "Equal", value: "llm", effect: "NoSchedule"}
        - {key: "nvidia.com/gpu", operator: "Exists", effect: "NoSchedule"}
      # Simétrico al matching-worker: el LLM nunca co-reside con el facematch en la misma GPU física.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app.kubernetes.io/name: matching-worker}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports: [{containerPort: 11434, name: http}]
          resources:
            requests: {cpu: "1", memory: 6Gi, nvidia.com/gpu: 1}
            limits:   {cpu: "2", memory: 10Gi, nvidia.com/gpu: 1}
          volumeMounts: [{name: models, mountPath: /root/.ollama}]
      volumes: [{name: models, emptyDir: {}}]   # o PVC/EFS para cachear los pesos
