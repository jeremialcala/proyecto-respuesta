apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: core-backend-consumer
spec:
  scaleTargetRef: {name: core-backend-consumer}
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 120
  triggers:
    - type: aws-sqs-queue
      authenticationRef: {name: keda-aws-irsa}
      metadata:
        queueURL: https://sqs.sa-east-1.amazonaws.com/ACCOUNT_ID/report-received
        queueLength: "50"
        awsRegion: sa-east-1
        identityOwner: operator
