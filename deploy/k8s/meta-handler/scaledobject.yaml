# KEDA: escala el Meta Handler por profundidad de la cola meta-received (ADR-0012).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: meta-handler
spec:
  scaleTargetRef: {name: meta-handler}
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 120
  triggers:
    - type: aws-sqs-queue
      authenticationRef: {name: keda-aws-irsa}
      metadata:
        queueURL: https://sqs.sa-east-1.amazonaws.com/ACCOUNT_ID/meta-received
        queueLength: "50"
        awsRegion: sa-east-1
        identityOwner: operator
