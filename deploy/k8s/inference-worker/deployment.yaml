apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker
  labels: {app.kubernetes.io/name: inference-worker, app.kubernetes.io/part-of: respuesta}
spec:
  replicas: 1   # GPU-bound; el escalado lo gobierna KEDA (scaledobject.yaml)
  selector:
    matchLabels: {app.kubernetes.io/name: inference-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: inference-worker}
    spec:
      serviceAccountName: inference-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      # Plano GPU del facematch (ADR-0018): pool `facematch`, nunca la GPU del LLM.
      nodeSelector: {"respuesta.io/gpu-pool": "facematch"}
      tolerations:
        - {key: "respuesta.io/gpu-pool", operator: "Equal", value: "facematch", effect: "NoSchedule"}
        - {key: "nvidia.com/gpu", operator: "Exists", effect: "NoSchedule"}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app.kubernetes.io/name: llm}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: inference-worker
          # Imagen de inferencia DISTINTA de la del worker (ADR-0019 §1, `Dockerfile.inference`).
          # El destino (EKS sa-east-1 / on-prem / vast.ai Secure Cloud) es configuración, no esta imagen.
          image: respuesta/matching-worker-inference:0.1.0
          envFrom:
            - configMapRef: {name: inference-worker-config}
          # SIN secretRef: el plano de inferencia no lleva credenciales a Vault/DB (ADR-0019 §4).
          resources:
            requests: {cpu: "1", memory: 2Gi, nvidia.com/gpu: 1}
            limits:   {cpu: "2", memory: 4Gi, nvidia.com/gpu: 1}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: models, emptyDir: {}}   # cache/engine de solo-lectura; o volumen con el engine horneado
        - {name: tmp, emptyDir: {}}
