apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-gateway
  labels: {app.kubernetes.io/name: webhook-gateway, app.kubernetes.io/part-of: respuesta}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: webhook-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: webhook-gateway}
    spec:
      serviceAccountName: webhook-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: webhook-gateway
          image: respuesta/webhook-gateway:0.1.0
          ports: [{containerPort: 8080, name: http}]
          envFrom:
            - configMapRef: {name: webhook-gateway-config}
            - secretRef: {name: webhook-gateway-secrets}   # gestionado por External Secrets (Vault/Secrets Manager)
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
