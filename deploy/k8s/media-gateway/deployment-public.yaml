apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-gateway-public
  labels: {app.kubernetes.io/name: media-gateway-public, app.kubernetes.io/part-of: respuesta}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: media-gateway-public}
  template:
    metadata:
      labels: {app.kubernetes.io/name: media-gateway-public}
    spec:
      serviceAccountName: media-gateway
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: media-gateway-public
          image: respuesta/media-gateway:0.1.0
          # Plano público (sirve los bytes de la foto). CMD por defecto del Dockerfile (public_main:8080).
          ports: [{containerPort: 8080, name: http}]
          envFrom:
            - configMapRef: {name: media-gateway-config}
            - secretRef: {name: media-gateway-secrets}   # GRANT_DSN, AUDIT_DSN, HMAC_KEY_ID (External Secrets)
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
