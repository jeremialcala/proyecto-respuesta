apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-gateway-public
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: media-gateway-public}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-gateway-internal
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: media-gateway-internal}
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
