apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-gateway-public
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing   # Meta descarga la foto por la URL firmada
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:sa-east-1:ACCOUNT_ID:certificate/CERT_ID
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    - host: media.higerotech.com   # coincide con PUBLIC_BASE_URL
      http:
        paths:
          - path: /m
            pathType: Prefix
            backend: {service: {name: media-gateway-public, port: {number: 80}}}
