[project]
name = "chatbot-gateway"
version = "0.1.0"
description = "Pasarela de Chatbot (Respuesta) — consume inbound.text, aplica rieles, conversa con el LLM on-prem (no autoritativo) y publica outbound.reply/report.received (ADR-0001/0002/0012)."
requires-python = ">=3.10"

dependencies = [
    "boto3>=1.34",   # SQS (inbound.text / outbound.reply / report.received)
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
