[project]
name = "vault-worker"
version = "0.1.0"
description = "Worker de Control de Bóveda (Respuesta) — descarga, escanea (AV/CSAM), cifra (sobre por usuario) y persiste medios; emite media.stored (ADR-0005/0008/0012)."
requires-python = ">=3.10"

dependencies = [
    "boto3>=1.34",   # SQS (inbound.media / media.stored), S3 (bóveda), KMS (envoltura de DEK)
    "cryptography>=42.0",  # AES-GCM del cifrado de sobre (DEK por objeto, ADR-0008)
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
