[project]
name = "media-gateway"
version = "0.1.0"
description = "Media Delivery Gateway (Respuesta) — único borde público de salida de medios: entrega binarios cifrados de la bóveda bajo concesión firmada y efímera (ADR-0017)."
requires-python = ">=3.10"

# Runtime. El dominio y la aplicación NO dependen de estas (solo los adaptadores/API).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "boto3>=1.34",            # S3 GetObject (bóveda) + KMS Decrypt/HMAC (ADR-0008)
    "psycopg[binary]>=3.1",   # ledger de concesiones + auditoría encadenada (ADR-0007)
    "redis>=5.0",             # rate-limit por token/IP/global
    "cryptography>=42.0",     # AES-GCM (descifrado al vuelo del medio)
]

[project.optional-dependencies]
test = ["pytest>=7.4", "httpx>=0.27"]   # httpx: TestClient de FastAPI

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
