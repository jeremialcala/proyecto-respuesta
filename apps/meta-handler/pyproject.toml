[project]
name = "meta-handler"
version = "0.1.0"
description = "Meta Handler de Respuesta — consume meta.received, normaliza y reparte a inbound.text/inbound.media (ADR-0005/0012)."
requires-python = ">=3.10"

dependencies = [
    "boto3>=1.34",   # SQS (consume meta.received; publica inbound.text/inbound.media)
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
