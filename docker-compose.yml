# Respuesta — entorno de desarrollo local (ADR-0014).
# Levanta dependencias gestionadas como locales: Postgres+pgvector, Redis y LocalStack (SQS/SNS),
# más los servicios de la plataforma. En AWS, estas dependencias son RDS, ElastiCache y SQS/SNS
# reales; aquí se emulan para iterar sin nube. El matching-worker requiere GPU → perfil "gpu".
name: respuesta

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: respuesta
      POSTGRES_PASSWORD: respuesta
      POSTGRES_DB: respuesta
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U respuesta"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    # Community: solo SQS/SNS/KMS (efímeros, ok para mensajería transitoria). La PERSISTENCIA de
    # LocalStack es función de pago (el tier Hobby no la incluye — verificado), así que la persistencia
    # de los medios la da MinIO (S3 real con volumen). El init es idempotente.
    image: localstack/localstack:3
    environment:
      SERVICES: sqs,sns,s3,kms
      DEBUG: "0"
      AWS_DEFAULT_REGION: sa-east-1   # init y healthcheck operan en la región de los servicios (ADR-0006)
    ports: ["4566:4566"]
    volumes:
      - "./deploy/localstack/init:/etc/localstack/init/ready.d:ro"
    healthcheck:
      # Sondea el ÚLTIMO recurso que crea el init (KMS alias): así "service_healthy" implica
      # que las colas/topics ya existen y los consumers no arrancan antes (evita el race de QueueDoesNotExist).
      test: ["CMD-SHELL", "awslocal kms describe-key --key-id alias/respuesta-vault >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Bóveda S3 persistente (ADR-0008): MinIO guarda los medios cifrados en un volumen, así sobreviven a
  # reinicios (a diferencia del S3 efímero de LocalStack). En prod son S3+KMS reales.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]   # 9000 API S3, 9001 consola web
    volumes: ["minio-data:/data"]

  # Crea los buckets de la bóveda en MinIO al arrancar (one-shot, imagen mc con shell). Reintenta hasta
  # que MinIO responde; idempotente (--ignore-existing). Los consumidores esperan a que termine.
  createbuckets:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'esperando minio...'; sleep 1; done;
      mc mb --ignore-existing local/respuesta-media;
      mc mb --ignore-existing local/respuesta-quarantine;
      echo 'buckets MinIO listos';
      "

  webhook-gateway:
    build: ./apps/webhook-gateway
    depends_on:
      redis: {condition: service_healthy}
      localstack: {condition: service_healthy}
    environment:
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      REDIS_URL: redis://redis:6379/0
      SQS_RAW_QUEUE_URL: http://localstack:4566/000000000000/meta-received
      META_BOT_ID: ${META_BOT_ID:-bot-dev}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-verify-dev}
      META_APP_SECRET: ${META_APP_SECRET:-app-secret-dev}
    ports: ["8080:8080"]

  meta-handler:
    build: ./apps/meta-handler
    depends_on:
      localstack: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_INPUT_QUEUE_URL: http://localstack:4566/000000000000/meta-received
      SQS_TEXT_QUEUE_URL: http://localstack:4566/000000000000/inbound-text
      SQS_MEDIA_QUEUE_URL: http://localstack:4566/000000000000/inbound-media
      REDIS_URL: redis://redis:6379/0   # abre la ventana de 24h que consume el output-service

  vault-worker:
    build: ./apps/vault-worker
    # Consume inbound.media: descarga el binario de Graph, escanea, cifra y guarda en S3 (MinIO).
    # SQS/SNS en LocalStack; S3 en MinIO (persistente). Necesita META_GRAPH_TOKEN real para bajar de Meta.
    depends_on:
      localstack: {condition: service_healthy}
      createbuckets: {condition: service_completed_successfully}
    environment:
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: minioadmin       # creds de MinIO (LocalStack ignora el valor para SQS/SNS)
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://localstack:4566       # SQS/SNS/KMS
      AWS_ENDPOINT_URL_S3: http://minio:9000          # S3 → MinIO persistente (boto3 lo prioriza para S3)
      SQS_INPUT_QUEUE_URL: http://localstack:4566/000000000000/inbound-media
      SQS_STORED_QUEUE_URL: arn:aws:sns:sa-east-1:000000000000:media-stored
      MEDIA_BUCKET: respuesta-media
      QUARANTINE_BUCKET: respuesta-quarantine
      KMS_KEY_ID: alias/respuesta-vault
      VAULT_CIPHER: ${VAULT_CIPHER:-passthrough}   # dev: JPEG plano (el matcher aún no descifra). Prod: kms
      S3_SSE: ${S3_SSE:-}                            # dev/MinIO sin SSE-KMS. Prod: aws:kms
      META_GRAPH_TOKEN: ${META_GRAPH_TOKEN:-graph-token-dev}

  # Ollama empaquetado: opt-in con `--profile llm`. Por defecto el chatbot usa el Ollama del HOST
  # (OLLAMA_URL apunta a host.docker.internal:11434), así no se levanta un segundo Ollama.
  llm:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    # Ollama necesita la GPU: gemma3:27b (~17 GB) no cabe en CPU/RAM. Misma reserva que el
    # matching-worker (requiere NVIDIA Container Toolkit). Sin esto, Ollama arranca en CPU (VRAM 0 B).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  chatbot-gateway:
    build: ./apps/chatbot-gateway
    profiles: ["chat"]
    depends_on:
      localstack: {condition: service_healthy}
      postgres: {condition: service_healthy}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # resuelve el Ollama del host en Linux/Docker Desktop
    environment:
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_INPUT_QUEUE_URL: http://localstack:4566/000000000000/inbound-text
      SQS_REPLY_QUEUE_URL: http://localstack:4566/000000000000/outbound-reply
      SQS_REPORT_QUEUE_URL: http://localstack:4566/000000000000/report-received
      # Feedback de enrolamiento de la foto al reportante (ADR-0016)
      SQS_ENTITY_ENROLLED_URL: http://localstack:4566/000000000000/entity-enrolled
      SQS_ENROLLMENT_FAILED_URL: http://localstack:4566/000000000000/enrollment-failed
      # Desambiguación multi-rostro (ADR-0016): consume requested, publica resolved
      SQS_FACE_DISAMBIGUATION_REQUESTED_URL: http://localstack:4566/000000000000/face-disambiguation-requested
      SQS_DISAMBIGUATION_RESOLVED_URL: http://localstack:4566/000000000000/face-disambiguation-resolved
      OLLAMA_URL: ${OLLAMA_URL:-http://llm:11434}   # servicio llm del compose (perfil llm). Host: http://host.docker.internal:11434
      LLM_MODEL: ${LLM_MODEL:-gemma3:27b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}      # s; sube si el modelo es grande / hay cola
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Memoria de conversación (ADR-0015): Postgres+pgvector + embeddings on-prem
      PGVECTOR_DSN: postgresql://respuesta:respuesta@postgres:5432/respuesta
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}   # vacío → memoria solo con ventana reciente
      EMBED_DIM: ${EMBED_DIM:-768}
      CHAT_RECENT_TURNS: ${CHAT_RECENT_TURNS:-6}
      CHAT_RETRIEVAL_K: ${CHAT_RETRIEVAL_K:-4}

  output-service:
    build: ./apps/output-service
    depends_on:
      localstack: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_INPUT_QUEUE_URL: http://localstack:4566/000000000000/outbound-reply
      REDIS_URL: redis://redis:6379/0
      META_GRAPH_TOKEN: ${META_GRAPH_TOKEN:-graph-token-dev}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-000000000000000}
      OUTPUT_DRY_RUN: ${OUTPUT_DRY_RUN:-true}   # dev local: con token real, ponlo en false (.env)
      HSM_TEMPLATE: ${HSM_TEMPLATE:-jornada_update}   # plantilla aprobada para envíos fuera de la ventana 24h
      HSM_LANG: ${HSM_LANG:-es}

  core-backend:
    build: ./apps/core-backend
    depends_on:
      postgres: {condition: service_healthy}
      localstack: {condition: service_healthy}
    environment:
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      PGVECTOR_DSN: postgresql://respuesta:respuesta@postgres:5432/respuesta
      SQS_REPORT_RECEIVED_URL: http://localstack:4566/000000000000/report-received
      SNS_REPORT_INGESTED_ARN: arn:aws:sns:sa-east-1:000000000000:report-ingested
      SNS_STATE_CHANGED_ARN: arn:aws:sns:sa-east-1:000000000000:state-changed
    ports: ["8081:8080"]

  core-backend-consumer:
    build: ./apps/core-backend
    command: ["python","-m","core_backend"]
    depends_on:
      postgres: {condition: service_healthy}
      localstack: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      PGVECTOR_DSN: postgresql://respuesta:respuesta@postgres:5432/respuesta
      REDIS_URL: redis://redis:6379/0   # correlación foto↔reporte por contacto (ADR-0016)
      SQS_REPORT_RECEIVED_URL: http://localstack:4566/000000000000/report-received
      SQS_MEDIA_STORED_URL: http://localstack:4566/000000000000/media-stored-intake
      SNS_REPORT_INGESTED_ARN: arn:aws:sns:sa-east-1:000000000000:report-ingested
      SNS_STATE_CHANGED_ARN: arn:aws:sns:sa-east-1:000000000000:state-changed

  matching-worker:
    build: ./apps/matching-worker
    profiles: ["gpu"]   # requiere NVIDIA Container Toolkit; omitido en `up` por defecto
    depends_on:
      postgres: {condition: service_healthy}
      localstack: {condition: service_healthy}
      createbuckets: {condition: service_completed_successfully}
    environment:
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: minioadmin       # creds de MinIO (LocalStack ignora el valor para SQS/SNS)
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://localstack:4566       # SQS/SNS
      AWS_ENDPOINT_URL_S3: http://minio:9000          # S3 (lee la foto, guarda recortes) → MinIO
      PGVECTOR_DSN: postgresql://respuesta:respuesta@postgres:5432/respuesta
      SQS_INPUT_QUEUE_URL: http://localstack:4566/000000000000/report-ingested
      SNS_OUTPUT_TOPIC_ARN: arn:aws:sns:sa-east-1:000000000000:candidate-generated
      # Enrolamiento biométrico y desambiguación (ADR-0016)
      SQS_DISAMBIGUATION_RESOLVED_URL: http://localstack:4566/000000000000/face-disambiguation-resolved
      SNS_ENTITY_ENROLLED_ARN: arn:aws:sns:sa-east-1:000000000000:entity-enrolled
      SNS_ENROLLMENT_FAILED_ARN: arn:aws:sns:sa-east-1:000000000000:enrollment-failed
      SNS_FACE_DISAMBIGUATION_REQUESTED_ARN: arn:aws:sns:sa-east-1:000000000000:face-disambiguation-requested
      MEDIA_BUCKET: respuesta-media
      S3_SSE: ${S3_SSE:-}                             # dev/MinIO sin SSE-KMS. Prod: aws:kms
    volumes:
      - "insightface-models:/models"   # cache del modelo buffalo_l (no re-descargar ~300 MB)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

volumes:
  pgdata:
  minio-data:   # bóveda S3 persistente (medios cifrados) — sobrevive a reinicios
  insightface-models:   # cache del modelo ArcFace/buffalo_l del matching-worker
  # Reusa el volumen Ollama del host (ya tiene gemma3:27b + nomic-embed-text) en vez de uno vacío
  # namespaceado (respuesta_ollama), para no re-descargar ~17 GB en el perfil llm.
  ollama:
    external: true
    name: ollama
